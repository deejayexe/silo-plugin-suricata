name: Suricata CI and release

on:
  push:
    branches: [main, "0.0.1"]
    paths-ignore: ["manifest.json", "repository.json", "docs/**", "**/*.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: suricata-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        plugin: [surimatrix, surify, duplicata]
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: plugins/${{ matrix.plugin }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.27.4"
          cache-dependency-path: plugins/${{ matrix.plugin }}/go.sum
      - name: Test and inspect
        env:
          PLUGIN: ${{ matrix.plugin }}
          GOWORK: "off"
        run: |
          flags=()
          if [ "$PLUGIN" = surimatrix ]; then flags=(-tags goolm); fi
          go test -race "${flags[@]}" ./...
          go vet "${flags[@]}" ./...
          if [ "$PLUGIN" = duplicata ]; then
            node --check internal/review/web/app.js
            python3 -m unittest discover -s tests -v
          fi
          git diff --exit-code -- go.mod go.sum
      - name: Build installation candidate
        env:
          PLUGIN: ${{ matrix.plugin }}
          BUILD_NUMBER: ${{ github.run_id }}.${{ github.run_attempt }}
        run: |
          flags=()
          export CGO_ENABLED=0
          if [ "$PLUGIN" = surimatrix ]; then flags=(-tags goolm); export CGO_ENABLED=1; fi
          base=$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')
          version="$base"
          if [ "$GITHUB_REF_NAME" != main ]; then
            if [ "$PLUGIN" = duplicata ] && [ "$base" = 0.1.0 ]; then base=0.1.1; fi
            version="$base-dev.$BUILD_NUMBER"
          fi
          arch=$(go env GOARCH)
          mkdir -p ../../dist
          go build "${flags[@]}" -trimpath -ldflags="-s -w -X main.version=$version" -o "../../dist/$PLUGIN-linux-$arch" .
          "../../dist/$PLUGIN-linux-$arch" manifest > ../../dist/runtime-manifest.json
          python3 - "$version" <<'PY'
          import json, re, sys
          from pathlib import Path
          actual = json.loads(Path('../../dist/runtime-manifest.json').read_text())
          expected = json.loads(Path('manifest.json').read_text())
          assert actual.get('plugin_id', actual.get('pluginId')) == expected['plugin_id']
          assert actual['version'] == sys.argv[1]
          def canonical(value):
              if isinstance(value, dict):
                  return {re.sub(r'_([a-z])', lambda m: m[1].upper(), k): canonical(v) for k, v in value.items()}
              if isinstance(value, list):
                  return [canonical(v) for v in value]
              return value
          assert canonical(actual['presentation']) == canonical(expected['presentation'])
          PY
          rm ../../dist/runtime-manifest.json
          if [ "$PLUGIN" = surify ] && [ "$arch" = amd64 ]; then
            GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version=$version" -o ../../dist/surify-darwin-arm64 .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.plugin }}-${{ matrix.runner }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/0.0.1') && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.27.4"
          cache-dependency-path: plugins/surify/go.sum
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Select release
        id: release
        run: |
          suite=$(cat VERSION)
          [[ "$suite" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "suite=$suite" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_NAME" = main ]; then
            echo "tag=v$suite" >> "$GITHUB_OUTPUT"
          else
            echo "tag=testing-$suite-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          fi
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse "origin/$GITHUB_REF_NAME")" = "$GITHUB_SHA"
      - name: Generate and validate combined catalog
        env:
          BUILD_NUMBER: ${{ github.run_id }}.${{ github.run_attempt }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          python3 -m unittest discover -s tests -v
          flags=()
          if [ "$GITHUB_REF_NAME" = main ]; then flags=(--stable); fi
          python3 scripts/catalog.py --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --build-number "$BUILD_NUMBER" "${flags[@]}"
          cd plugins/surify
          go run ./cmd/catalogcheck -normalize ../../dist/manifest.json
      - name: Publish packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          flags=(--prerelease --latest=false)
          if [ "$GITHUB_REF_NAME" = main ]; then flags=(--latest); fi
          gh release create "$RELEASE_TAG" "${flags[@]}" --target "$GITHUB_SHA" --title "Suricata ${{ steps.release.outputs.suite }}" --notes "Surimatrix, Surify and Duplicata from $GITHUB_SHA. Source branch: $GITHUB_REF_NAME. See each plugin README for setup and credentials." dist/*
      - name: Publish catalog on the source branch
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse "origin/$GITHUB_REF_NAME")" = "$GITHUB_SHA"
          cp dist/manifest.json manifest.json
          cp dist/repository.json repository.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json repository.json
          git commit -m "Publish validated Suricata catalog"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
